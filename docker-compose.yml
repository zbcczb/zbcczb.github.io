services:
  db:
    image: postgres:16-alpine
    container_name: embroidery-postgres
    environment:
      POSTGRES_DB: embroidery_factory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d embroidery_factory"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: embroidery-api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/embroidery_factory
      OFFLINE_THRESHOLD_SECONDS: 15
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
